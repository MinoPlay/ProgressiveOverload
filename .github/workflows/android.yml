# Builds the Android app (a Trusted Web Activity in android/) and publishes the signed APK
# as a GitHub Release. See .github/features/android-app.md.
name: Build Android APK

on:
    push:
        branches: [main]
        paths:
            - 'android/**'
            - '.github/workflows/android.yml'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: android-release
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Build signed APK
              working-directory: android
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
              run: |
                  if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
                      echo '::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets.'
                      exit 1
                  fi
                  export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
                  echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
                  ./gradlew assembleRelease --no-daemon
                  cp build/outputs/apk/release/ProgressiveOverload-release.apk "$RUNNER_TEMP/ProgressiveOverload.apk"

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "android-v$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/ProgressiveOverload.apk" \
                      --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
                      --title "Android app 1.0.$GITHUB_RUN_NUMBER" \
                      --notes 'On your Android phone, download ProgressiveOverload.apk below and open it to install or update.'
