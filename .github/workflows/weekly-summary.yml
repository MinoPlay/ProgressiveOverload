name: Weekly Workout Summary

on:
  schedule:
    # Monday 04:00 UTC = 05:00 CET (Danish winter) / 06:00 CEST (Danish summer)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      week_offset:
        description: 'Weeks back to report (1 = previous week, 2 = two weeks ago, ...)'
        default: '1'
        required: false
        type: string

permissions:
  contents: read
  models: read

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate week date range
        id: dates
        run: |
          OFFSET="${{ inputs.week_offset || '1' }}"

          # Day of week: 1=Mon … 7=Sun (GNU date %u)
          DOW=$(date +%u)

          # Days back to reach the Monday of OFFSET weeks ago
          DAYS_BACK=$(( (DOW - 1) + 7 * OFFSET ))

          WEEK_START=$(date -d "${DAYS_BACK} days ago" +%Y-%m-%d)
          WEEK_END=$(date -d "${WEEK_START} + 6 days" +%Y-%m-%d)

          echo "week_start=${WEEK_START}" >> "$GITHUB_OUTPUT"
          echo "week_end=${WEEK_END}"     >> "$GITHUB_OUTPUT"
          echo "Reporting week: ${WEEK_START} → ${WEEK_END}"

      - name: Build AI request payload
        run: node .github/scripts/build-workout-context.js
        env:
          WEEK_START: ${{ steps.dates.outputs.week_start }}
          WEEK_END:   ${{ steps.dates.outputs.week_end }}

      - name: Generate summary via GitHub Models API
        run: |
          HTTP_CODE=$(curl -s -w "%{http_code}" -o api-response.json \
            -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            -d @api-request.json \
            "https://models.inference.ai.azure.com/chat/completions")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::GitHub Models API returned HTTP ${HTTP_CODE}"
            cat api-response.json
            exit 1
          fi

          node -e "
            const r = JSON.parse(require('fs').readFileSync('api-response.json', 'utf8'));
            if (r.error) {
              process.stderr.write('API error: ' + JSON.stringify(r.error) + '\n');
              process.exit(1);
            }
            const content = r.choices[0].message.content;
            require('fs').writeFileSync('summary.md', content);
            console.log('Summary generated (' + content.length + ' chars)');
          "

      - name: Write job summary
        run: |
          WEEK_START="${{ steps.dates.outputs.week_start }}"
          WEEK_END="${{ steps.dates.outputs.week_end }}"

          {
            echo "# 🏋️ Weekly Workout Report"
            echo ""
            echo "> **Period:** ${WEEK_START} → ${WEEK_END} &nbsp;|&nbsp; **Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "---"
            echo ""
            cat summary.md
          } >> "$GITHUB_STEP_SUMMARY"
