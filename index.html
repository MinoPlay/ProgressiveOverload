<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progressive Overload — Insight Lab</title>
    <style>
      :root {
        --bg: #07131d;
        --bg-alt: #0d1b28;
        --panel: rgba(16, 28, 38, 0.82);
        --panel-soft: rgba(20, 35, 48, 0.95);
        --stroke: rgba(149, 177, 202, 0.16);
        --text: #ebf7ff;
        --muted: #9db6c5;
        --accent: #68d7ff;
        --accent-2: #8d7bff;
        --good: #5ce2a6;
        --shadow: 0 30px 60px rgba(0, 0, 0, 0.28);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: radial-gradient(circle at top, #0a1d2d, var(--bg) 38%);
        color: var(--text); font-family: Inter, "Segoe UI", sans-serif;
      }
      .app {
        max-width: 1360px; margin: 0 auto; padding: 28px 18px 48px;
      }
      .shell {
        display: grid; grid-template-columns: 240px 1fr; gap: 20px;
      }
      .sidebar, .main {
        background: var(--panel); border: 1px solid var(--stroke); border-radius: 28px; box-shadow: var(--shadow);
      }
      .sidebar {
        padding: 24px 18px; display: flex; flex-direction: column; gap: 18px;
      }
      .brand {
        display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.02em;
      }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #04151d; font-weight: 900;
      }
      .menu { display: grid; gap: 10px; margin-top: 12px; }
      .menu-item {
        padding: 12px 14px; border-radius: 14px; color: var(--muted); text-decoration: none; font-weight: 700;
      }
      .menu-item.active {
        background: rgba(104, 215, 255, 0.08); color: var(--text); border: 1px solid rgba(104,215,255, 0.22);
      }
      .mini-panel {
        margin-top: auto; background: linear-gradient(180deg, rgba(141,123,255,0.12), rgba(18,33,45,0.9));
        border-radius: 20px; padding: 18px; border: 1px solid rgba(141,123,255,0.2);
      }
      .main {
        padding: 24px;
      }
      .topbar {
        display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px;
      }
      h1 { margin: 0; font-size: clamp(2rem, 3vw, 3rem); }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .filter {
        background: rgba(255,255,255,0.03); border: 1px solid var(--stroke); color: var(--muted);
        border-radius: 12px; padding: 10px 12px; font-weight: 700;
      }
      .hero-grid {
        display: grid; grid-template-columns: 2fr 1fr; gap: 18px; margin-bottom: 18px;
      }
      .panel-card {
        background: var(--panel-soft); border: 1px solid var(--stroke); border-radius: 22px; padding: 18px;
      }
      .chart-wrap {
        height: 230px; display: flex; align-items: end; gap: 12px; padding-top: 18px;
      }
      .bar-group {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;
      }
      .bars {
        width: 100%; height: 100%; display: flex; align-items: end; justify-content: center; gap: 8px;
      }
      .bar {
        flex: 1; border-radius: 12px 12px 0 0; min-height: 18px; background: linear-gradient(180deg, var(--accent), var(--accent-2));
      }
      .bar.alt { background: linear-gradient(180deg, #56e2a4, #29b481); }
      .kpis {
        display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px;
      }
      .kpi-card {
        border-radius: 18px; background: rgba(255,255,255,0.03); border: 1px solid var(--stroke); padding: 16px;
      }
      .kpi-label { color: var(--muted); font-size: 0.8rem; }
      .kpi-value { font-size: 2rem; font-weight: 800; margin-top: 8px; }
      .trend { color: var(--good); font-size: .8rem; font-weight: 700; }
      .two-col {
        display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; margin-top: 18px;
      }
      .segments {
        display: grid; gap: 12px; margin-top: 14px;
      }
      .segment {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        background: rgba(255,255,255,0.02); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--stroke);
      }
      .dot {
        width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px;
      }
      .ring {
        width: 140px; height: 140px; border-radius: 50%; border: 18px solid rgba(104,215,255,0.18); border-top-color: var(--accent); position: relative; margin: 10px auto;
        display: grid; place-items: center; font-weight: 800; font-size: 1.5rem;
      }
      @media (max-width: 980px) {
        .shell, .hero-grid, .two-col { grid-template-columns: 1fr; }
        .sidebar { order: 2; }
        .main { order: 1; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-mark">P</div>
            Progressive
          </div>

          <nav class="menu" aria-label="Sidebar navigation">
            <a class="menu-item active" href="#">Overview</a>
            <a class="menu-item" href="#">Strength</a>
            <a class="menu-item" href="#">Volume</a>
            <a class="menu-item" href="#">Recovery</a>
            <a class="menu-item" href="#">Exercises</a>
          </nav>

          <div class="mini-panel">
            <div style="font-size:0.7rem; text-transform: uppercase; letter-spacing:0.12em; color:var(--muted);">Momentum</div>
            <div style="font-size:1.8rem; font-weight:800; margin-top:10px;">+11.3%</div>
            <div style="color:var(--good); margin-top:6px; font-weight:700;">vs last month</div>
          </div>
        </aside>

        <main class="main">
          <div class="topbar">
            <h1>Insight Lab</h1>
            <div class="controls">
              <button class="filter">Monthly</button>
              <button class="filter">Reset</button>
            </div>
          </div>

          <section class="hero-grid">
            <div class="panel-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                <strong>Training volume</strong>
                <span class="trend">+12.4%</span>
              </div>
              <div class="chart-wrap">
                <div class="bar-group"><div class="bars"><div class="bar" style="height:44%"></div><div class="bar alt" style="height:70%"></div></div><span>Jan</span></div>
                <div class="bar-group"><div class="bars"><div class="bar" style="height:52%"></div><div class="bar alt" style="height:88%"></div></div><span>Feb</span></div>
                <div class="bar-group"><div class="bars"><div class="bar" style="height:58%"></div><div class="bar alt" style="height:95%"></div></div><span>Mar</span></div>
                <div class="bar-group"><div class="bars"><div class="bar" style="height:66%"></div><div class="bar alt" style="height:100%"></div></div><span>Apr</span></div>
                <div class="bar-group"><div class="bars"><div class="bar" style="height:72%"></div><div class="bar alt" style="height:110%"></div></div><span>May</span></div>
                <div class="bar-group"><div class="bars"><div class="bar" style="height:80%"></div><div class="bar alt" style="height:122%"></div></div><span>Jun</span></div>
              </div>
            </div>

            <div class="kpis">
              <div class="kpi-card">
                <div class="kpi-label">Avg sessions</div>
                <div class="kpi-value">3.8</div>
                <div class="trend">+0.5/wk</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">1RM lift</div>
                <div class="kpi-value">104</div>
                <div class="trend">+4kg</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Recovery</div>
                <div class="kpi-value">86</div>
                <div class="trend">Stable</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Streak</div>
                <div class="kpi-value">19</div>
                <div class="trend">days</div>
              </div>
            </div>
          </section>

          <section class="two-col">
            <div class="panel-card">
              <div style="font-weight:800; margin-bottom: 8px;">Muscle balance</div>
              <div class="segments">
                <div class="segment"><span><span class="dot" style="background:#68d7ff"></span>Chest</span><strong>31%</strong></div>
                <div class="segment"><span><span class="dot" style="background:#5ce2a6"></span>Back</span><strong>24%</strong></div>
                <div class="segment"><span><span class="dot" style="background:#8d7bff"></span>Legs</span><strong>28%</strong></div>
                <div class="segment"><span><span class="dot" style="background:#ffbf69"></span>Shoulders</span><strong>17%</strong></div>
              </div>
            </div>

            <div class="panel-card">
              <div style="font-weight:800; margin-bottom: 8px;">Goal completion</div>
              <div class="ring">72%</div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
